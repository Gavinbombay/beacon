[package]
license = "Apache-2.0"
name = "beacon"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"

[features]
default = []
game_forward = ["dep:beacon-forward", "beacon-admin/game_forward", "beacon-store/game_forward"]

[workspace]
members = [
    "crates/beacon-core",
    "crates/beacon-http",
    "crates/beacon-tls",
    "crates/beacon-dns",
    "crates/beacon-brain",
    "crates/beacon-store",
    "crates/beacon-admin"
]
exclude = ["crates/beacon-forward"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
toml = "0.8"
arc-swap = "1.7"
axum = "0.7"
hyper = "1"
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
sha2 = "0.10"
base64 = "0.22"
# Use PostgreSQL components directly: the facade locks unused MySQL/SQLite drivers.
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "uuid", "chrono", "json"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["uuid", "chrono", "json"] }
regex = "1"
rand = "0.8.6"
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "server-auto", "service", "http1", "http2"] }
http-body-util = "0.1"
mime_guess = "2.0"
bytes = "1"
futures-util = "0.3"
bcrypt = "0.16"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
sha1 = "0.10"

[[bin]]
name = "beacon"
path = "src/main.rs"

[dependencies]
beacon-core = { path = "crates/beacon-core" }
beacon-http = { path = "crates/beacon-http" }
beacon-tls = { path = "crates/beacon-tls" }
beacon-dns = { path = "crates/beacon-dns" }
beacon-brain = { path = "crates/beacon-brain" }
beacon-store = { path = "crates/beacon-store" }
beacon-admin = { path = "crates/beacon-admin" }
beacon-forward = { path = "crates/beacon-forward", optional = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
reqwest = { workspace = true, features = ["http2"] }
